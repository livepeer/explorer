name: CI

on:
  pull_request:
    branches: ['*']

# Least privilege: jobs only read the repo unless they say otherwise.
permissions:
  contents: read

# Actions are pinned to full commit SHAs (the tag each was at is noted), so
# a moved tag can't swap in different code. Update them deliberately.

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_INFURA_KEY: TEST_INFURA_KEY
      NEXT_PUBLIC_NETWORK: ARBITRUM_ONE
      NEXT_PUBLIC_SUBGRAPH_API_KEY: TEST_SUBGRAPH_KEY

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
          run_install: false

      - name: 🟢 Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: 📦 Install dependencies (workspace)
        run: pnpm install --frozen-lockfile

      - name: 🧹 Run linter
        run: pnpm lint

      - name: 📋 Run typecheck
        run: pnpm typecheck

      - name: 🧪 Run tests
        run: pnpm test

      # Fails on known high or critical advisories in production
      # dependencies.
      - name: 🔒 Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  # Fails the PR if it introduces a dependency with a known vulnerability.
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔍 Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
