query transactions($account: String!, $first: Int!, $skip: Int!) {
  transactions(
    orderBy: timestamp
    orderDirection: desc
    where: { from: $account }
    first: $first
    skip: $skip
  ) {
    events {
      __typename
      round {
        id
      }
      transaction {
        id
        timestamp
      }
      ... on BondEvent {
        delegator {
          id
        }
        newDelegate {
          id
        }
        oldDelegate {
          id
        }
        additionalAmount
      }
      ... on UnbondEvent {
        delegate {
          id
        }
        amount
      }
      ... on RebondEvent {
        delegate {
          id
        }
        amount
      }
      ... on TranscoderUpdateEvent {
        rewardCut
        feeShare
      }
      ... on RewardEvent {
        rewardTokens
      }
      # Sent by the orchestrator itself (setRewardCaller uses msg.sender), so
      # the `from`-keyed query above already carries it.
      ... on RewardCallerSetEvent {
        rewardCaller
      }
      ... on WithdrawStakeEvent {
        amount
      }
      ... on WithdrawFeesEvent {
        amount
      }
      ... on DepositFundedEvent {
        sender {
          id
        }
        amount
      }
      ... on ReserveFundedEvent {
        reserveHolder {
          id
        }
        amount
      }
      ... on TreasuryVoteEvent {
        id
        reason
        support
        timestamp
        proposal {
          id
          targets
          description
        }
        treasuryVoter: voter {
          id
        }
        weight
        round {
          id
        }
        transaction {
          id
          timestamp
        }
      }
      ... on VoteEvent {
        voter
        poll {
          id
          proposal
          endBlock
          quorum
          quota
        }
        transaction {
          id
          timestamp
        }
        choiceID
        id
        round {
          id
        }
        timestamp
      }
    }
  }
  winningTicketRedeemedEvents(
    orderBy: timestamp
    orderDirection: desc
    where: { or: [{ recipient: $account }, { sender: $account }] }
    first: $first
    skip: $skip
  ) {
    __typename
    id
    round {
      id
    }
    transaction {
      id
      timestamp
    }
    faceValue
    sender {
      id
    }
    recipient {
      id
    }
  }
  # Since LIP-118 the reward() sender and the orchestrator being rewarded can be
  # two different addresses, and neither side is covered by the `from`-keyed
  # transactions query above: match the orchestrator (delegate) so its delegated
  # calls are listed, and the sender so a nominated reward caller sees the calls
  # it made. `or` returns distinct entities, so a self-call is listed once.
  rewardEvents(
    orderBy: timestamp
    orderDirection: desc
    where: {
      or: [{ delegate: $account }, { transaction_: { from: $account } }]
    }
    first: $first
    skip: $skip
  ) {
    __typename
    id
    round {
      id
    }
    transaction {
      id
      timestamp
    }
    rewardTokens
    delegate {
      id
    }
  }
}
